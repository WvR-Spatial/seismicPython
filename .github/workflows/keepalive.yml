name: Keepalive

# GitHub documents that "in a public repository, scheduled workflows are
# automatically disabled when no repository activity has occurred in 60 days".
# Workflow *runs* do not count as activity, so a repo that only ever runs its own
# schedule will eventually have that schedule switched off -- you get an email and
# have to re-enable it by hand.
#
# This job pushes an empty commit monthly to reset that clock. It is OFF by
# default because it does add commits to history. To turn it on, create a
# repository variable named ENABLE_KEEPALIVE with the value "true"
# (Settings -> Secrets and variables -> Actions -> Variables).
#
# If you push to this repo more often than every two months anyway, leave it off.

on:
  schedule:
    - cron: "23 5 1 * *" # 05:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    if: vars.ENABLE_KEEPALIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push an empty commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive so scheduled workflows stay enabled"
          git push
