name: Build and publish dashboard

# The site is rebuilt on a schedule and deployed straight to GitHub Pages from
# the build artifact. Nothing is committed back to the repository: the map alone
# is ~700 KB and git keeps every version forever, so committing each rebuild
# would grow the repo without bound.
#
# Because nothing is committed, the scheduled runs never count as repository
# activity, and GitHub disables a public repo's scheduled workflows after 60
# days without activity. The keepalive job at the bottom handles that.

on:
  schedule:
    # Every six hours, deliberately off the hour -- GitHub delays scheduled runs
    # during the load spike at :00. Times are UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      feed:
        description: "USGS summary feed"
        type: choice
        default: week
        options: [hour, day, week, month, significant_month]
      min_magnitude:
        description: "Minimum magnitude"
        default: "4.0"
      radius_km:
        description: "Impact radius in km"
        default: "50"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the site
        run: |
          python -m seismic_monitor \
            --feed "${{ inputs.feed || 'week' }}" \
            --min-magnitude "${{ inputs.min_magnitude || '4.0' }}" \
            --radius-km "${{ inputs.radius_km || '50' }}" \
            --output-dir site
        env:
          PYTHONPATH: src
          # Mapbox public access token. Add it under
          # Settings -> Secrets and variables -> Actions -> Secrets.
          # Without it the build falls back to the keyless Esri dark canvas, so a
          # missing secret degrades the map rather than breaking the deploy.
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          # Only needed if you switch --basemap to carto-dark.
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}

      - name: Check the build produced something
        run: |
          test -s site/index.html
          test -s site/seismic_risk_map.html
          test -s site/summary.json
          grep -q "api.mapbox.com" site/seismic_risk_map.html \
            || echo "::warning::No Mapbox tiles in the output - is the MAPBOX_TOKEN secret set?"
          echo "Site contents:" && ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    # GitHub disables scheduled workflows in a public repository after 60 days
    # without repository activity. Calling the "enable" endpoint on a workflow
    # that is already enabled resets that clock. GitHub does not document the
    # reset, but it is the mechanism the common keepalive actions rely on.
    #
    # Why it lives here rather than in a separate keepalive workflow:
    # - It runs on every scheduled build, so the clock never gets near 60 days.
    # - It does not depend on the build: a broken upstream feed fails the build
    #   but still keeps the schedule alive, so the site recovers on its own once
    #   the feed is back.
    # - A separate scheduled keepalive is itself subject to the same 60-day rule.
    # No commits, no third-party action (gh is preinstalled on the runner), and
    # only this job holds actions: write.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/enable"
          state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml" --jq .state)
          echo "publish.yml state: ${state}"
          test "${state}" = "active"
